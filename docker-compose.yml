name: free-classrooms-bot-unitn

x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  free-classrooms-bot:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - path: .env
        required: false
    environment:
      - Database__ConnectionString=mongodb://mongo:27017
      - Database__LogRetentionDays=${LOG_RETENTION_DAYS:-90}
      - Bot__BotName=Free Classrooms Bot - UNITN
      - Health__Port=8080
      - Logging__LogLevel__Default=Warning
      - Logging__LogLevel__Microsoft=Warning
      - Logging__LogLevel__System.Net.Http.HttpClient=Warning
    logging: *log-rotation
    mem_limit: 512m
    cpus: '2'

  mongo:
    image: mongo:6.0
    command: ["--quiet"]
    restart: unless-stopped
    logging: *log-rotation
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
